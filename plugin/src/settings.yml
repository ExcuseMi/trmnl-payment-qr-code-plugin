---
strategy: webhook
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.0
serverless_language: node
refresh_interval_floor: '5'
polling_url: ''
polling_headers: ''
polling_body: ''
id: 494226
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: about
  name: About This Plugin
  field_type: author_bio
  category: finance,personal
  help_text: TRMNL X Ready
  description: 'Made by ExcuseMi.<br /><br />Source code, issues and examples are on <a href=''https://github.com/ExcuseMi/trmnl-payment-qr-code-plugin''>GitHub</a>. The <a href=''https://excusemi.github.io/trmnl-payment-qr-code-plugin/''>web editor</a> updates the screen through the webhook.<br /><br />Learn more: <a href=''https://github.com/ExcuseMi/trmnl-payment-qr-code-plugin#readme''>how it works</a>.'
  github_url: https://github.com/ExcuseMi/trmnl-payment-qr-code-plugin
- keyname: data_source
  name: Data Source
  field_type: select
  description: Where the screen gets its content. With a webhook the payment (amount, reference, text) can be changed without opening these settings, for example by staff using a simple web page on their phone, with no TRMNL account needed. With Webhook the fields below are hidden and the screen shows only what the webhook sent.
  options:
  - Plugin settings: settings
  - Webhook: webhook
  default: settings
  conditional_validation:
  - when: settings
    hidden:
    - webhook_url
  - when: webhook
    hidden:
    - payment_type
    - epc_name
    - epc_iban
    - epc_amount
    - epc_reference
    - qr_text
    - title
    - caption
    - body
    - footer
    - title_bar
    - show_title_bar
    - title_bar_icon
    - icon
    - image_url
- keyname: webhook_url
  name: Webhook URL
  field_type: copyable_webhook_url
  description: 'Copy this URL into the <a href=''https://excusemi.github.io/trmnl-payment-qr-code-plugin/''>web editor</a> to change the payment from your phone or computer, or POST to it from a script (see the <a href=''https://github.com/ExcuseMi/trmnl-payment-qr-code-plugin#optional-webhook''>README</a>). Keep it private: anyone with this URL can change your QR code.'
  optional: true
- keyname: payment_type
  name: Payment Type
  field_type: select
  description: What the QR code contains.
  options:
  - SEPA transfer (EPC QR): epc
  - Payment link or text: text
  default: epc
  conditional_validation:
  - when: epc
    hidden:
    - qr_text
  - when: text
    hidden:
    - epc_name
    - epc_iban
    - epc_amount
    - epc_reference
- keyname: epc_name
  name: Beneficiary Name
  field_type: string
  description: Name of the account holder (max 70 characters).
  placeholder: Jane Doe
  optional: true
- keyname: epc_iban
  name: IBAN
  field_type: string
  description: The account to pay into. Spaces are fine.
  placeholder: BE71 0961 2345 6769
  optional: true
- keyname: epc_amount
  name: Amount (EUR)
  field_type: string
  description: Leave empty to let the payer choose the amount.
  placeholder: '12.50'
  optional: true
- keyname: epc_reference
  name: Payment Reference
  field_type: string
  description: Message shown on the transfer (max 140 characters).
  placeholder: Coffee fund
  optional: true
- keyname: qr_text
  name: Payment Link or Text
  field_type: string
  description: Encoded as-is. To fix the amount, put it in the link (most services support it, e.g. paypal.me/yourname/12.50).<br /><strong>Examples:</strong> https://paypal.me/yourname, https://revolut.me/yourname, bitcoin:bc1q...?amount=0.001
  placeholder: https://paypal.me/yourname
  optional: true
- keyname: title
  name: Title
  field_type: string
  description: Large text next to or above the QR code.
  placeholder: Buy me a coffee
  optional: true
- keyname: caption
  name: QR Caption
  field_type: string
  description: Short line under the QR code. For SEPA it defaults to the amount, or Any amount.
  placeholder: Scan to pay
  optional: true
- keyname: body
  name: Text
  field_type: text
  description: Shown next to (or under) the QR code.
  help_text: Supports <a href='https://onlinemarkdown.com/cheat-sheet'>markdown</a>. Leave a blank line between paragraphs.
  placeholder: |-
    ## Coffee fund

    Every cup is **EUR 0.50**.

    - Open your banking app
    - Scan the code
    - Enjoy your coffee
  optional: true
- keyname: footer
  name: Footer
  field_type: string
  description: One short line at the bottom, like a thank you.
  placeholder: Thank you!
  optional: true
- keyname: title_bar
  name: Title Bar Text
  field_type: string
  description: The text in the bar at the bottom. Leave empty to use the plugin name.
  placeholder: Payment QR Code
  optional: true
- keyname: show_title_bar
  name: Show Title Bar
  field_type: boolean
  default: true
  optional: true
- keyname: title_bar_icon
  name: Title Bar Icon URL
  field_type: url
  description: A small square image for the title bar. Leave empty for the plugin icon.
  placeholder: https://example.com/icon.png
  optional: true
- keyname: icon
  name: Icon
  field_type: select
  description: Shown next to the title. Red on color screens.
  options:
  - None: none
  - Heart: heart
  - Coffee: coffee
  - Beer: beer
  - Food: food
  - Gift: gift
  - Shopping cart: cart
  - Home: home
  - Group: users
  - Wallet: wallet
  - Euro: euro
  - Dollar: dollar
  - Phone: phone
  - Star: star
  default: none
  optional: true
- keyname: image_url
  name: Image URL
  field_type: url
  description: A logo or photo. Replaces the icon when set.
  placeholder: https://example.com/logo.png
  optional: true
name: Payment QR Code
description: Payment QR code with your own text
recipe_overview: Show a scannable payment QR code on your TRMNL, so people can pay you by pointing their phone at the screen. Choose a SEPA bank transfer (EPC QR, opened by most European banking apps with name, IBAN, amount and reference filled in) with a fixed amount or one the payer picks, or encode any payment link such as PayPal.me, Revolut or a Bitcoin address. Add a title, a caption under the code and markdown text, including price lists where each price lines up on the right with a dotted leader. The layout adapts by itself to your text and screen, from full screen and portrait to half and quarter mashup slots, and adds a red accent on color screens. Use it for a coffee corner, a shared household fund, a market stall, a club membership or a tip jar. Switch Data Source to Webhook to update prices, amount or reference from a simple web editor on any phone, so staff can change the screen without a TRMNL account.
refresh_interval: 15
