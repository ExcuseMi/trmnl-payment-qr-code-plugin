---
strategy: webhook
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.0
serverless_language:
refresh_interval_floor:
polling_url: ''
polling_headers: ''
polling_body: ''
id: 494226
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: about
  name: About This Plugin
  field_type: author_bio
  category: finance,personal
  help_text: TRMNL X Ready
  description: Show a scannable payment QR code with your own text.<br /><br /><strong>Payment types:</strong><br /> ● SEPA transfer (EPC QR, scanned by most European banking apps)<br /> ● Any payment link or text (PayPal.me, Payconiq, Tikkie, Revolut, Stripe, Bitcoin, ...)<br /><br />The layout adapts to your text, the screen and the mashup size. Markdown text, an icon or your own image.<br /><br /><strong>Optional webhook:</strong> set Data Source to Webhook and everything below can be overridden from the <a href='https://excusemi.github.io/trmnl-payment-qr-code-plugin/'>web editor</a> (or any script), e.g. to change the amount or reference per payment. Clear it to fall back to these settings.
  github_url: https://github.com/ExcuseMi/trmnl-payment-qr-code-plugin
- keyname: data_source
  name: Data Source
  field_type: select
  description: Where the screen gets its content. With a webhook you can change the payment (amount, reference, text) without opening these settings; anything the webhook leaves out comes from the fields below.
  options:
  - Plugin settings: settings
  - Webhook: webhook
  default: settings
  conditional_validation:
  - when: settings
    hidden:
    - webhook_url
- keyname: webhook_url
  name: Webhook URL
  field_type: copyable_webhook_url
  description: 'Copy this URL into the <a href=''https://excusemi.github.io/trmnl-payment-qr-code-plugin/''>web editor</a> to change the payment from your phone or computer, or POST to it from a script (see the <a href=''https://github.com/ExcuseMi/trmnl-payment-qr-code-plugin#optional-webhook''>README</a>). Keep it private: anyone with this URL can change your QR code.'
  optional: true
- keyname: payment_type
  name: Payment Type
  field_type: select
  description: What the QR code contains.
  options:
  - SEPA transfer (EPC QR): epc
  - Payment link or text: text
  default: epc
  conditional_validation:
  - when: epc
    hidden:
    - qr_text
    required:
    - epc_name
    - epc_iban
  - when: text
    hidden:
    - epc_name
    - epc_iban
    - epc_amount
    - epc_reference
    required:
    - qr_text
- keyname: epc_name
  name: Beneficiary Name
  field_type: string
  description: Name of the account holder (max 70 characters).
  placeholder: Jane Doe
  optional: true
- keyname: epc_iban
  name: IBAN
  field_type: string
  description: The account to pay into. Spaces are fine.
  placeholder: BE71 0961 2345 6769
  optional: true
- keyname: epc_amount
  name: Amount (EUR)
  field_type: string
  description: Leave empty to let the payer choose the amount.
  placeholder: '12.50'
  optional: true
- keyname: epc_reference
  name: Payment Reference
  field_type: string
  description: Message shown on the transfer (max 140 characters).
  placeholder: Coffee fund
  optional: true
- keyname: qr_text
  name: Payment Link or Text
  field_type: string
  description: Encoded as-is. To fix the amount, put it in the link (most services support it, e.g. paypal.me/yourname/12.50).<br /><strong>Examples:</strong> https://paypal.me/yourname, https://revolut.me/yourname, bitcoin:bc1q...?amount=0.001
  placeholder: https://paypal.me/yourname
  optional: true
- keyname: title
  name: Title
  field_type: string
  description: Large text next to or above the QR code.
  placeholder: Buy me a coffee
  optional: true
- keyname: caption
  name: QR Caption
  field_type: string
  description: Short line under the QR code. For SEPA it defaults to the amount, or Any amount.
  placeholder: Scan to pay
  optional: true
- keyname: body
  name: Text
  field_type: text
  description: Shown next to (or under) the QR code.
  help_text: Supports <a href='https://onlinemarkdown.com/cheat-sheet'>markdown</a>. Leave a blank line between paragraphs.
  placeholder: |-
    ## Coffee fund

    Every cup is **EUR 0.50**.

    - Open your banking app
    - Scan the code
    - Enjoy your coffee
  optional: true
- keyname: footer
  name: Footer
  field_type: string
  description: One short line at the bottom, like a thank you.
  placeholder: Thank you!
  optional: true
- keyname: title_bar
  name: Title Bar Text
  field_type: string
  description: The text in the bar at the bottom. Leave empty to use the plugin name.
  placeholder: Payment QR Code
  optional: true
- keyname: icon
  name: Icon
  field_type: select
  description: Shown next to the title. Red on color screens.
  options:
  - None: none
  - Heart: heart
  - Coffee: coffee
  - Beer: beer
  - Food: food
  - Gift: gift
  - Shopping cart: cart
  - Home: home
  - Group: users
  - Wallet: wallet
  - Euro: euro
  - Dollar: dollar
  - Phone: phone
  - Star: star
  default: none
  optional: true
- keyname: image_url
  name: Image URL
  field_type: url
  description: A logo or photo. Replaces the icon when set.
  placeholder: https://example.com/logo.png
  optional: true
name: Payment QR Code
description: Payment QR code with your own text
refresh_interval: 1440
